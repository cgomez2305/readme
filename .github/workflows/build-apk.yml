# The native Android app (Flutter) is kept in the repo but is no longer the main product.
# Run it by hand from the Actions tab when needed.
name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fulcro-apk
          path: build/app/outputs/flutter-apk/*.apk
